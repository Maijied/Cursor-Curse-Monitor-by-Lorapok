<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Welcome Animation">
  <defs>
    <linearGradient id="welcomeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5b9dff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="welcomeGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="welcomeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="welcomeFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="128" cy="128" r="100" fill="url(#welcomeGlow)" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="100;110;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot body -->
  <ellipse cx="128" cy="180" rx="56" ry="44" fill="#1a1f28" stroke="url(#welcomeGrad1)" stroke-width="3">
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="128" cy="128" rx="48" ry="40" fill="#1a1f28" stroke="url(#welcomeGrad1)" stroke-width="3"/>
  
  <!-- Head -->
  <ellipse cx="128" cy="100" rx="44" ry="36" fill="#1a1f28" stroke="url(#welcomeGrad1)" stroke-width="3"/>
  
  <!-- Eyes -->
  <ellipse cx="108" cy="96" rx="12" ry="8" fill="#0d1117" stroke="#39ff14" stroke-width="2"/>
  <ellipse cx="148" cy="96" rx="12" ry="8" fill="#0d1117" stroke="#39ff14" stroke-width="2"/>
  
  <!-- Glowing pupils -->
  <circle cx="108" cy="96" r="5" fill="#39ff14" filter="url(#welcomeFilter)">
    <animate attributeName="r" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="96" r="5" fill="#39ff14" filter="url(#welcomeFilter)">
    <animate attributeName="r" values="5;6;5" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Smile -->
  <path d="M112 112 Q128 124 144 112" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" filter="url(#welcomeFilter)">
    <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Welcome hand wave -->
  <path d="M180 160 Q200 140 210 160 Q200 180 180 160" fill="#1a1f28" stroke="url(#welcomeGrad2)" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" values="0 195 160;20 195 160;0 195 160" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Sparkles around -->
  <circle cx="48" cy="64" r="4" fill="#7c5cff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="208" cy="64" r="4" fill="#5b9dff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="48" cy="192" r="3" fill="#39ff14" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="208" cy="192" r="3" fill="#00ff88" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Orbiting particles -->
  <circle cx="128" cy="40" r="3" fill="#7c5cff">
    <animate attributeName="cx" values="128;168;128;88;128" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;128;216;128;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="216" r="3" fill="#39ff14">
    <animate attributeName="cx" values="128;88;128;168;128" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="216;128;40;128;216" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>

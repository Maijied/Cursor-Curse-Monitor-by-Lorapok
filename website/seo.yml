# Source of truth for SEO — edited by humans; artifacts generated by scripts/generate-seo.mjs
site:
  base: https://cursor.lorapok.tech
  locale: en_US
  author: Mohammad Maizied Hasan Majumder

openGraph:
  type: website
  image: /assets/marketing/og-social-card.png

twitter:
  card: summary_large_image

pages:
  index:
    file: index.html
    path: /
    title: "{displayName} — Live Cursor Usage Dashboard"
    description: >-
      Cursor Curse Monitor by Lorapok Labs — live included quota, Auto/API meters,
      budget tracking, local credential scanner, Firefox & Chrome browser extension,
      and free Composer 2.5 fallback. Private to your Cursor login only.
    keywords:
      - Cursor IDE
      - usage monitor
      - Lorapok Labs
      - Composer 2.5
      - billing
      - budget
      - quota
      - extension
      - Open VSX
      - VS Code Marketplace
      - Firefox
      - browser extension
      - security scanner
      - credential leak
    changefreq: weekly
    priority: "1.0"
    ogTitle: "{displayName}"
    ogDescription: Live Cursor usage dashboard with local security scanner. Firefox & Chrome extensions. Your data stays on your machine.
    twitterTitle: "{displayName}"
    twitterDescription: Monitor Cursor usage limits, scan for leaked credentials locally, and auto-fallback to free Composer 2.5.

  privacy:
    file: privacy.html
    path: /privacy.html
    title: Privacy Policy — {displayName}
    description: Privacy policy for Cursor Curse Monitor. Usage data is visible only to the logged-in Cursor user on their own machine.
    changefreq: monthly
    priority: "0.6"
    ogTitle: Privacy Policy — {displayName}
    ogDescription: Privacy policy for Cursor Curse Monitor by Lorapok Labs.
    twitterTitle: Privacy Policy — {displayName}
    twitterDescription: Local-first Cursor usage extension — your data stays on your machine.

  terms:
    file: terms.html
    path: /terms.html
    title: Terms of Use — {displayName}
    description: Terms of use for Cursor Curse Monitor by Lorapok. Local-first extension; optional anonymous heartbeat; marketing site analytics.
    changefreq: monthly
    priority: "0.5"
    ogTitle: Terms of Use — {displayName}
    ogDescription: Terms of use for Cursor Curse Monitor by Lorapok Labs.
    twitterTitle: Terms of Use — {displayName}
    twitterDescription: Terms of use for Cursor Curse Monitor by Lorapok Labs.

structuredData:
  graph:
    - id: ide_extension
      type: SoftwareApplication
      name: "{displayName}"
      applicationCategory: DeveloperApplication
      operatingSystem: Windows, macOS, Linux
      featureList: Usage dashboard, security scanner, local insights, budget tracking
      downloadUrl: "{vsixUrl}"
    - id: browser_extension
      type: SoftwareApplication
      name: "{displayName} Browser Extension"
      applicationCategory: BrowserApplication
      operatingSystem: Firefox, Chrome
      featureList: Budget tracker popup, credential paste guard, cursor.com token capture
      downloadUrl: https://addons.mozilla.org/en-US/firefox/addon/cursor-curse-monitor-by-lorapok/

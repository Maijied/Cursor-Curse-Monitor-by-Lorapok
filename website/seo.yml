# Source of truth for SEO — edited by humans; artifacts generated by scripts/generate-seo.mjs
site:
  base: https://cursor.lorapok.tech
  locale: en_US
  author: Mohammad Maizied Hasan Majumder

openGraph:
  type: website
  image: /assets/marketing/og-social-card.png

twitter:
  card: summary_large_image

pages:
  index:
    file: index.html
    path: /
    title: "{displayName} — Live usage dashboard"
    description: >-
      Live included quota, Auto/API meters, budget tracking, and a local credential
      scanner. Browser extension for Firefox and Chrome. Works in VS Code–based AI
      IDEs via Open VSX or the Marketplace. Private to your login — data stays local.
    keywords:
      - usage monitor
      - AI IDE
      - billing
      - budget
      - quota
      - browser extension
      - Firefox
      - security scanner
      - credential leak
      - Composer 2.5
    changefreq: weekly
    priority: "1.0"
    ogTitle: "{displayName}"
    ogDescription: Live usage dashboard with local security scanner. Browser extensions available. Your data stays on your machine.
    twitterTitle: "{displayName}"
    twitterDescription: Track usage limits, scan for leaked credentials locally, and auto-fallback to free Composer 2.5.

  privacy:
    file: privacy.html
    path: /privacy.html
    title: Privacy Policy — {displayName}
    description: Privacy policy for Cursor Curse Monitor. Usage data is visible only to the logged-in Cursor user on their own machine.
    changefreq: monthly
    priority: "0.6"
    ogTitle: Privacy Policy — {displayName}
    ogDescription: Privacy policy for Cursor Curse Monitor by Lorapok Labs.
    twitterTitle: Privacy Policy — {displayName}
    twitterDescription: Local-first Cursor usage extension — your data stays on your machine.

  terms:
    file: terms.html
    path: /terms.html
    title: Terms of Use — {displayName}
    description: Terms of use for Cursor Curse Monitor by Lorapok. Local-first extension; optional anonymous heartbeat; marketing site analytics.
    changefreq: monthly
    priority: "0.5"
    ogTitle: Terms of Use — {displayName}
    ogDescription: Terms of use for Cursor Curse Monitor by Lorapok Labs.
    twitterTitle: Terms of Use — {displayName}
    twitterDescription: Terms of use for Cursor Curse Monitor by Lorapok Labs.

structuredData:
  graph:
    - id: ide_extension
      type: SoftwareApplication
      name: "{displayName}"
      applicationCategory: DeveloperApplication
      operatingSystem: Windows, macOS, Linux
      featureList: Usage dashboard, security scanner, local insights, budget tracking, multi-account switching
      downloadUrl: "{vsixUrl}"
    - id: browser_extension
      type: SoftwareApplication
      name: "{displayName} Browser Extension"
      applicationCategory: BrowserApplication
      operatingSystem: Firefox, Chrome
      featureList: Budget tracker popup, credential paste guard, cursor.com token capture
      downloadUrl: "{firefoxDownloadUrl}"

# KV namespaces live in Facility; dashboard titles use key-style prefix
# CURSOR_CURSOR-ADMIN_KV / CURSOR_CURSOR-ADMIN_KV_PREVIEW while the code
# binding stays ADMIN_KV. Prod URL: cursor-monitor-admin-2x8.pages.dev
name = "cursor-monitor-admin"

# Deploy target: Cloudflare account "Lorapok Facility" (f049faaf2f67549f5c58837479596a4a)
# Set CLOUDFLARE_ACCOUNT_ID to that value for wrangler / GitHub Actions.
# KV namespaces live in Facility; dashboard titles use key-style prefix
# CURSOR_CURSOR-ADMIN_KV / CURSOR_CURSOR-ADMIN_KV_PREVIEW while the code
# binding stays ADMIN_KV. Prod URL: cursor-monitor-admin-2x8.pages.dev
name = "cursor-monitor-admin"
pages_build_output_dir = "dist"
compatibility_date = "2024-08-14"
compatibility_flags = ["nodejs_compat"]

# Lorapok Facility (f049faaf2f67549f5c58837479596a4a) — created 2026-08-16
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "8a29ab111ed0488297e12725072e9a10"
preview_id = "1555368c415e40a7b7e591784f1dc22c"

# Phase 2 storage — system logs + subscriber index (see website/admin/d1/schema.sql)
[[d1_databases]]
binding = "ADMIN_D1"
database_name = "ccm-admin-d1"
database_id = "c38fc653-be43-4222-976b-da5ab829107a"

# Phase 2 blobs — after enabling R2 in dashboard + `node scripts/create-r2-stats-bucket.mjs`, add:
# [[r2_buckets]]
# binding = "STATS_R2"
# bucket_name = "ccm-admin-stats"

# Pages Functions use REST mail (CLOUDFLARE_EMAIL_API_TOKEN). send_email binding is Workers-only.
# Mission Control calls ccm-mail-relay via service binding (preferred — no REST token needed).

[[services]]
binding = "MAIL_RELAY"
service = "ccm-mail-relay"

[vars]
# ADMIN_MASTER_EMAIL — set as encrypted Pages secret / GitHub Actions secret (not in git)
FIREBASE_PROJECT_ID = "cursor-curse-by-lorapok"
SITE_DATA_URL = "https://cursor.lorapok.tech/site-data.json"
ADMIN_PUBLIC_URL = "https://cursor-dev.lorapok.tech"
CLOUDFLARE_ACCOUNT_ID = "f049faaf2f67549f5c58837479596a4a"

# Outbound mail (Pages Functions):
# 1. Deploy ccm-mail-relay worker (send_email binding) — preferred path via [[services]] above
# 2. npx wrangler email sending enable lorapok.tech
# 3. Optional REST fallback: Pages secret CLOUDFLARE_EMAIL_API_TOKEN (Email Sending → Edit)
# 4. Optional Resend fallback: RESEND_API_KEY

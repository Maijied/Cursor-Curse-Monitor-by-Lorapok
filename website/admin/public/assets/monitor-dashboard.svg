<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Monitor Dashboard">
  <defs>
    <linearGradient id="screenGrad" x1="32" y1="28" x2="96" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="40" y1="60" x2="88" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Monitor frame -->
  <rect x="20" y="20" width="88" height="64" rx="6" fill="#2a3040" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="28" y="28" width="72" height="48" rx="3" fill="url(#screenGrad)" stroke="#5b9dff" stroke-width="1"/>
  
  <!-- Chart line -->
  <path d="M32 64 L44 56 L56 60 L68 44 L80 52 L92 36" fill="none" stroke="url(#chartGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#screenGlow)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Data points -->
  <circle cx="44" cy="56" r="3" fill="#39ff14" filter="url(#screenGlow)">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="44" r="3" fill="#7c5cff" filter="url(#screenGlow)">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="92" cy="36" r="3" fill="#5b9dff" filter="url(#screenGlow)">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Monitor stand -->
  <rect x="56" y="84" width="16" height="12" fill="#2a3040" stroke="#4a5568" stroke-width="1"/>
  <rect x="44" y="96" width="40" height="4" rx="2" fill="#2a3040" stroke="#4a5568" stroke-width="1"/>
  
  <!-- Status indicator -->
  <circle cx="108" cy="24" r="4" fill="#39ff14" filter="url(#screenGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="activityGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="activityGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Robot body -->
  <ellipse cx="12" cy="14" rx="7" ry="5" fill="currentColor" opacity="0.9"/>
  <ellipse cx="12" cy="9" rx="5.5" ry="4.5" fill="currentColor" opacity="0.9"/>
  
  <!-- Neon accent line -->
  <path d="M8 10 Q12 13 16 10" stroke="url(#activityGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" filter="url(#activityGlow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Head -->
  <ellipse cx="12" cy="8" rx="5" ry="4" fill="currentColor" stroke="url(#activityGrad)" stroke-width="0.8"/>
  
  <!-- Eye sockets -->
  <ellipse cx="9.5" cy="7.5" rx="2" ry="2.2" fill="#0d1117" stroke="#00ff88" stroke-width="0.5"/>
  <ellipse cx="14.5" cy="7.5" rx="2" ry="2.2" fill="#0d1117" stroke="#00ff88" stroke-width="0.5"/>
  
  <!-- Glowing eyes -->
  <g filter="url(#activityGlow)">
    <circle cx="9.5" cy="7.5" r="1.2" fill="#00ff88">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14.5" cy="7.5" r="1.2" fill="#00ff88">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="9" cy="7" r="0.4" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="7" r="0.4" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
  
  <!-- Usage indicator ring -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="url(#activityGrad)" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robotic legs -->
  <path d="M7 17 L5 20" stroke="url(#activityGrad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M17 17 L19 20" stroke="url(#activityGrad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>

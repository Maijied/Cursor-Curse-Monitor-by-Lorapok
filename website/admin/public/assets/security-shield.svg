<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Security Shield">
  <defs>
    <linearGradient id="shieldGrad" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="32" y1="28" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Shield shape -->
  <path d="M64 20 L104 36 L104 64 Q104 88 64 108 Q24 88 24 64 L24 36 Z" fill="url(#shieldBg)" stroke="#2a3040" stroke-width="2"/>
  
  <!-- Shield border glow -->
  <path d="M64 20 L104 36 L104 64 Q104 88 64 108 Q24 88 24 64 L24 36 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#shieldGlow)" opacity="0.6"/>
  
  <!-- Lock icon in center -->
  <rect x="52" y="52" width="24" height="20" rx="3" fill="url(#shieldGrad)" filter="url(#shieldGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  <path d="M56 52 L56 44 Q56 36 64 36 Q72 36 72 44 L72 52" fill="none" stroke="#7c5cff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="62" r="3" fill="#0d1117">
    <animate attributeName="r" values="3;3.5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Checkmark indicators -->
  <circle cx="40" cy="48" r="4" fill="#39ff14">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M38 48 L40 50 L42 46" fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="88" cy="48" r="4" fill="#39ff14">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <path d="M86 48 L88 50 L90 46" fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="40" cy="80" r="4" fill="#39ff14">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <path d="M38 80 L40 82 L42 78" fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="88" cy="80" r="4" fill="#39ff14">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <path d="M86 80 L88 82 L90 78" fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
</svg>

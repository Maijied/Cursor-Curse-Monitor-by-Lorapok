<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Team Usage">
  <defs>
    <linearGradient id="teamGrad1" x1="24" y1="32" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="teamGrad2" x1="56" y1="32" x2="88" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <linearGradient id="teamGrad3" x1="88" y1="32" x2="120" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="teamGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- User 1 -->
  <circle cx="40" cy="48" r="16" fill="#1a1f28" stroke="url(#teamGrad1)" stroke-width="2"/>
  <circle cx="40" cy="44" r="6" fill="url(#teamGrad1)" filter="url(#teamGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M28 68 Q40 60 52 68" fill="none" stroke="url(#teamGrad1)" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="85" text-anchor="middle" font-size="8" fill="#8b96ad" font-family="ui-sans-serif, system-ui">USER 1</text>
  
  <!-- User 2 -->
  <circle cx="64" cy="48" r="16" fill="#1a1f28" stroke="url(#teamGrad2)" stroke-width="2"/>
  <circle cx="64" cy="44" r="6" fill="url(#teamGrad2)" filter="url(#teamGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <path d="M52 68 Q64 60 76 68" fill="none" stroke="url(#teamGrad2)" stroke-width="2" stroke-linecap="round"/>
  <text x="64" y="85" text-anchor="middle" font-size="8" fill="#8b96ad" font-family="ui-sans-serif, system-ui">USER 2</text>
  
  <!-- User 3 -->
  <circle cx="88" cy="48" r="16" fill="#1a1f28" stroke="url(#teamGrad3)" stroke-width="2"/>
  <circle cx="88" cy="44" r="6" fill="url(#teamGrad3)" filter="url(#teamGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <path d="M76 68 Q88 60 100 68" fill="none" stroke="url(#teamGrad3)" stroke-width="2" stroke-linecap="round"/>
  <text x="88" y="85" text-anchor="middle" font-size="8" fill="#8b96ad" font-family="ui-sans-serif, system-ui">USER 3</text>
  
  <!-- Connection lines -->
  <path d="M48 48 L56 48" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="4 2"/>
  <path d="M72 48 L80 48" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Team total indicator -->
  <rect x="32" y="96" width="64" height="20" rx="4" fill="#1a1f28" stroke="#7c5cff" stroke-width="1"/>
  <text x="64" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c5cff" font-family="ui-sans-serif, system-ui">TEAM TOTAL</text>
  
  <!-- Usage bars -->
  <rect x="36" y="118" width="16" height="6" rx="2" fill="#2a3040"/>
  <rect x="36" y="118" width="12" height="6" rx="2" fill="url(#teamGrad1)" filter="url(#teamGlow)"/>
  
  <rect x="56" y="118" width="16" height="6" rx="2" fill="#2a3040"/>
  <rect x="56" y="118" width="14" height="6" rx="2" fill="url(#teamGrad2)" filter="url(#teamGlow)"/>
  
  <rect x="76" y="118" width="16" height="6" rx="2" fill="#2a3040"/>
  <rect x="76" y="118" width="8" height="6" rx="2" fill="url(#teamGrad3)" filter="url(#teamGlow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Success Notification">
  <defs>
    <linearGradient id="successGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="successBody" x1="32" y1="40" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="successGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="successFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background glow circle -->
  <circle cx="64" cy="64" r="56" fill="url(#successGrad)" opacity="0.1" filter="url(#successFilter)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot body -->
  <ellipse cx="64" cy="78" rx="28" ry="22" fill="url(#successBody)" stroke="#00ff88" stroke-width="2"/>
  <ellipse cx="64" cy="52" rx="24" ry="20" fill="url(#successBody)" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="64" cy="44" rx="22" ry="18" fill="url(#successBody)" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Happy eyes -->
  <ellipse cx="54" cy="42" rx="6" ry="4" fill="#0d1117" stroke="#00ff88" stroke-width="1.5"/>
  <ellipse cx="74" cy="42" rx="6" ry="4" fill="#0d1117" stroke="#00ff88" stroke-width="1.5"/>
  
  <!-- Glowing pupils -->
  <circle cx="54" cy="42" r="2.5" fill="#00ff88" filter="url(#successFilter)">
    <animate attributeName="r" values="2.5;3;2.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="42" r="2.5" fill="#00ff88" filter="url(#successFilter)">
    <animate attributeName="r" values="2.5;3;2.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Smile -->
  <path d="M56 50 Q64 56 72 50" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" filter="url(#successFilter)">
    <animate attributeName="stroke-width" values="2;2.5;2" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Success checkmark -->
  <path d="M48 64 L58 74 L80 52" fill="none" stroke="url(#successGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#successFilter)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="1s" fill="freeze"/>
  </path>
  
  <!-- Sparkle effects -->
  <circle cx="32" cy="32" r="3" fill="#00ff88" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="32" r="3" fill="#00ff88" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="32" cy="96" r="2" fill="#39ff14" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="96" cy="96" r="2" fill="#39ff14" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Error Notification">
  <defs>
    <linearGradient id="errorGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ff8787"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="errorBody" x1="32" y1="40" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="errorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="70%" stop-color="#ff6b6b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="errorFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background glow circle -->
  <circle cx="64" cy="64" r="56" fill="url(#errorGrad)" opacity="0.1" filter="url(#errorFilter)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot body -->
  <ellipse cx="64" cy="78" rx="28" ry="22" fill="url(#errorBody)" stroke="#ff6b6b" stroke-width="2"/>
  <ellipse cx="64" cy="52" rx="24" ry="20" fill="url(#errorBody)" stroke="#ff6b6b" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="64" cy="44" rx="22" ry="18" fill="url(#errorBody)" stroke="#ff6b6b" stroke-width="2"/>
  
  <!-- Sad eyes -->
  <ellipse cx="54" cy="44" rx="6" ry="4" fill="#0d1117" stroke="#ff6b6b" stroke-width="1.5"/>
  <ellipse cx="74" cy="44" rx="6" ry="4" fill="#0d1117" stroke="#ff6b6b" stroke-width="1.5"/>
  
  <!-- Glowing pupils -->
  <circle cx="54" cy="44" r="2.5" fill="#ff6b6b" filter="url(#errorFilter)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="44" r="2.5" fill="#ff6b6b" filter="url(#errorFilter)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Frown -->
  <path d="M56 54 Q64 48 72 54" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" filter="url(#errorFilter)">
    <animate attributeName="stroke-width" values="2;2.5;2" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Error X -->
  <path d="M48 64 L80 96" fill="none" stroke="url(#errorGrad)" stroke-width="4" stroke-linecap="round" filter="url(#errorFilter)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="0.8s" fill="freeze"/>
  </path>
  <path d="M80 64 L48 96" fill="none" stroke="url(#errorGrad)" stroke-width="4" stroke-linecap="round" filter="url(#errorFilter)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="0.8s" fill="freeze" begin="0.2s"/>
  </path>
  
  <!-- Warning pulse -->
  <circle cx="64" cy="80" r="8" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="8;12;8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>

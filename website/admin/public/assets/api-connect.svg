<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="API Connection">
  <defs>
    <linearGradient id="apiGrad" x1="20" y1="64" x2="108" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="28" y1="28" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="apiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Connection lines -->
  <path d="M38 38 Q64 20 90 38" fill="none" stroke="url(#apiGrad)" stroke-width="2" stroke-linecap="round" filter="url(#apiGlow)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M38 90 Q64 108 90 90" fill="none" stroke="url(#apiGrad)" stroke-width="2" stroke-linecap="round" filter="url(#apiGlow)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  <path d="M38 38 L38 90" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M90 38 L90 90" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- API nodes -->
  <circle cx="38" cy="38" r="12" fill="url(#nodeGrad)" stroke="#5b9dff" stroke-width="2"/>
  <circle cx="38" cy="38" r="6" fill="#5b9dff" filter="url(#apiGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="90" cy="38" r="12" fill="url(#nodeGrad)" stroke="#7c5cff" stroke-width="2"/>
  <circle cx="90" cy="38" r="6" fill="#7c5cff" filter="url(#apiGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="38" cy="90" r="12" fill="url(#nodeGrad)" stroke="#7c5cff" stroke-width="2"/>
  <circle cx="38" cy="90" r="6" fill="#7c5cff" filter="url(#apiGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="90" cy="90" r="12" fill="url(#nodeGrad)" stroke="#39ff14" stroke-width="2"/>
  <circle cx="90" cy="90" r="6" fill="#39ff14" filter="url(#apiGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Central hub -->
  <circle cx="64" cy="64" r="16" fill="url(#nodeGrad)" stroke="url(#apiGrad)" stroke-width="2"/>
  <circle cx="64" cy="64" r="8" fill="url(#apiGrad)" filter="url(#apiGlow)"/>
  <circle cx="64" cy="64" r="4" fill="#0d1117"/>
  
  <!-- Data particles -->
  <circle cx="50" cy="30" r="2" fill="#39ff14" opacity="0.8">
    <animate attributeName="cx" values="50;78;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;30;30" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="98" r="2" fill="#39ff14" opacity="0.8">
    <animate attributeName="cx" values="50;78;50" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="98;98;98" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

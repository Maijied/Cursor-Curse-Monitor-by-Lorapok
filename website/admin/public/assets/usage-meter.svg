<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Usage Meter">
  <defs>
    <linearGradient id="meterGrad" x1="20" y1="100" x2="108" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="52" fill="url(#bgGrad)" stroke="#2a3040" stroke-width="2"/>
  
  <!-- Usage arc (75% filled) -->
  <path d="M64 16 A48 48 0 1 1 24 64" fill="none" stroke="url(#meterGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Remaining arc -->
  <path d="M24 64 A48 48 0 0 1 64 16" fill="none" stroke="#2a3040" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center indicator -->
  <circle cx="64" cy="64" r="8" fill="#0d1117" stroke="#7c5cff" stroke-width="2"/>
  <circle cx="64" cy="64" r="4" fill="#7c5cff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Percentage text -->
  <text x="64" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#eef2fb" font-family="ui-sans-serif, system-ui">75%</text>
  <text x="64" y="108" text-anchor="middle" font-size="8" fill="#8b96ad" font-family="ui-sans-serif, system-ui">USAGE</text>
</svg>

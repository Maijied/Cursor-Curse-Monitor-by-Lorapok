name: Publish Firefox Extension (AMO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1). Defaults to root package.json base."
        required: false
        type: string

permissions:
  contents: read

jobs:
  amo:
    name: Sign & Submit to AMO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync workspace versions (production)
        env:
          VERSION_CHANNEL: production
          GITHUB_EVENT_NAME: workflow_dispatch
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            npm run version:sync -- --version "$VERSION"
          else
            npm run version:sync -- --version "$(node -p "require('./package.json').version.split('-')[0]")"
          fi

      - name: Build browser extension
        run: npm run browser-ext:build

      - name: Publish to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node browser-extension/scripts/publish-amo.mjs

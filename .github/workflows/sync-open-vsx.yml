name: Sync Open VSX (Canonical)

# One-time or on-demand: publish current package.json version to lorapok-labs namespace.
# Uses scripts/publish-ovsx.mjs (repacks VSIX publisher before publish).

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: "Mark as pre-release on Open VSX"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-open-vsx
  cancel-in-progress: false

jobs:
  sync:
    name: Publish to lorapok-labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & package
        run: |
          npm ci
          npm run compile
          npm run package

      - name: Publish to Open VSX (lorapok-labs)
        run: |
          PRE_FLAG=""
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            PRE_FLAG="--pre-release"
          fi
          node scripts/publish-ovsx.mjs $PRE_FLAG
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Verify marketplace sync
        run: node scripts/verify-marketplace-sync.mjs --strict

      - name: Summary
        run: |
          node scripts/generate-site-data.mjs
          echo "## Open VSX Sync" >> $GITHUB_STEP_SUMMARY
          echo "Canonical namespace: **lorapok-labs**" >> $GITHUB_STEP_SUMMARY
          echo "Package version: $(node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY

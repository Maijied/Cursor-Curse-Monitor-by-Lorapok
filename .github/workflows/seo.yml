name: SEO & Sitemap

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - "scripts/generate-site-data.mjs"
      - "scripts/generate-seo.mjs"
      - "scripts/validate-seo.mjs"
      - ".github/workflows/seo.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    name: Generate & Validate SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate site data
        run: node scripts/generate-site-data.mjs
        env:
          ANALYTICS_STATS_URL: https://cursor-dev.lorapok.tech/api/analytics/stats

      - name: Generate SEO artifacts
        run: node scripts/generate-seo.mjs

      - name: Validate SEO
        run: node scripts/validate-seo.mjs

      - name: Upload SEO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-artifacts
          path: |
            website/sitemap.xml
            website/robots.txt
            website/seo.json
            website/site-data.json
            website/visitor-stats.json

      - name: Commit SEO artifacts when changed
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/sitemap.xml website/robots.txt website/seo.json website/site-data.json website/visitor-stats.json || true
          if git diff --staged --quiet; then
            echo "No SEO artifact changes"
          else
            git commit -m "chore(seo): weekly site-data and sitemap refresh"
            git push
          fi

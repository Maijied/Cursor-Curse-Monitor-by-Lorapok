name: CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Unified workflow for Cursor Curse Monitor
#
# Triggers:
#   PR to main        → ci (build/validate only)
#   Push to main      → ci (build dynamic VSIX artifact with commit hash) -> website
#   workflow_dispatch → release bump → deploy to marketplaces → website
#   Tag v*            → deploy to marketplaces → website
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_market:
        description: "Publish Market"
        required: true
        type: choice
        options:
          - Both
          - VS Code Marketplace
          - Open VSX
        default: Both
      release_channel:
        description: "Release Channel"
        required: true
        type: choice
        options:
          - Production
          - Beta (Pre-release)
        default: Production
      version_type:
        description: "Release Type (Tagging Rules)"
        required: true
        type: choice
        options:
          - "patch - Bug fix or Feature update (e.g. v0.7.1, v0.7.2)"
          - "minor - New Feature (e.g. v0.8.0)"
          - "major - Production / Breaking (e.g. v1.0.0)"
          - "custom - Specify exact version below"
        default: "patch - Bug fix or Feature update (e.g. v0.7.1, v0.7.2)"
      custom_version:
        description: "Custom version (e.g. 0.6.0-beta.1)"
        required: false
        type: string

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. CI — Build & Validate (Runs on every trigger)
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Validate icon & logo assets
        run: npm run validate:assets

      - name: Dynamically inject commit hash (Push to main only)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          NEW_VERSION="${CURRENT}-beta.${SHORT_SHA}"
          npm version --no-git-tag-version "$NEW_VERSION"
          echo "Dynamic version: $NEW_VERSION"

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-curse-monitor-vsix-${{ github.sha }}
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error

  admin-ci:
    name: Admin Panel CI
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/admin/package-lock.json

      - name: Generate site artifacts for admin build
        run: |
          node scripts/generate-site-data.mjs
          node scripts/generate-seo.mjs

      - name: Install admin dependencies
        working-directory: website/admin
        run: npm ci

      - name: Test admin panel
        working-directory: website/admin
        run: npm test

      - name: Build admin panel
        working-directory: website/admin
        run: npm run build

      - name: Assert admin static artifacts in dist
        working-directory: website/admin
        run: test -f dist/site-data.json && test -f dist/seo.json

  admin-deploy:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    needs: admin-ci
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, 'chore: release')
    environment:
      name: admin-production
      url: https://cursor-dev.lorapok.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/admin/package-lock.json

      - name: Generate site artifacts
        run: |
          node scripts/generate-site-data.mjs
          node scripts/generate-seo.mjs

      - name: Install admin dependencies
        working-directory: website/admin
        run: npm ci

      - name: Build admin panel
        working-directory: website/admin
        run: npm run build

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the admin-production environment."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=cursor-monitor-admin --branch=main

  # ───────────────────────────────────────────────────────────────────────────
  # 2. RELEASE TRIGGER — Manual version bump via workflow_dispatch
  # ───────────────────────────────────────────────────────────────────────────
  release-bump:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate and apply version bump
        id: bump
        run: |
          # Extract the base action type (e.g. "patch" from "patch - Bug fix...")
          BUMP_TYPE=$(echo "${{ inputs.version_type }}" | awk '{print $1}')
          
          if [ "$BUMP_TYPE" == "custom" ]; then
            if [ -z "${{ inputs.custom_version }}" ]; then
              echo "Error: custom_version is required when version_type is custom."
              exit 1
            fi
            NEW_VERSION="${{ inputs.custom_version }}"
            echo "Using custom version: $NEW_VERSION"
          else
            # Strip pre-release suffixes from package.json first to ensure clean bump
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.version=pkg.version.split('-')[0]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
            CURRENT=$(node -p "require('./package.json').version")
            echo "Current base version: $CURRENT"
            npm version $BUMP_TYPE --no-git-tag-version --preid=beta
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Auto-bumped $BUMP_TYPE: $NEW_VERSION"
          fi

          TAG="v$NEW_VERSION"
          
          # Only run npm version again if we used custom (to actually set the package.json)
          if [ "$BUMP_TYPE" == "custom" ]; then
             npm version --no-git-tag-version "$NEW_VERSION"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v$NEW_VERSION"
          git tag "$TAG"
          git push origin main
          git push origin "$TAG"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

          echo "## Release Version Created" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $NEW_VERSION (${{ inputs.release_channel }})" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY — Publish to Marketplaces
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Marketplaces
    runs-on: ubuntu-latest
    needs: [release-bump]
    if: always() && (needs.release-bump.outputs.bumped == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VSCE_PUBLISHER: "LorapokLabs"
      OVSX_PUBLISHER: "lorapok-labs"
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-bump.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & Compile
        run: |
          npm ci
          npm run compile
          npm run package

      - name: Install publishing tools
        run: |
          npm install -g @vscode/vsce
          npm install -g ovsx

      - name: Resolve Configuration
        id: config
        run: |
          VERSION="${{ needs.release-bump.outputs.new_version }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Determine pre-release flag
          PRE_RELEASE_FLAG=""
          if [[ "${{ inputs.release_channel }}" == "Beta (Pre-release)" ]]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi
          # Also fallback to auto-detecting beta from tag if triggered by push tag
          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"alpha"* ]]; then
             PRE_RELEASE_FLAG="--pre-release"
          fi
          echo "pre_release_flag=$PRE_RELEASE_FLAG" >> "$GITHUB_OUTPUT"

          # Determine target markets
          DO_OVSX="false"
          DO_VSCE="false"
          TARGET="${{ inputs.publish_market }}"
          if [[ -z "$TARGET" || "$TARGET" == "Both" ]]; then
             DO_OVSX="true"; DO_VSCE="true"
          elif [[ "$TARGET" == "Open VSX" ]]; then
             DO_OVSX="true"
          elif [[ "$TARGET" == "VS Code Marketplace" ]]; then
             DO_VSCE="true"
          fi
          echo "do_ovsx=$DO_OVSX" >> "$GITHUB_OUTPUT"
          echo "do_vsce=$DO_VSCE" >> "$GITHUB_OUTPUT"

      # ── Open VSX (canonical lorapok-labs namespace) ───────────────────────
      - name: Publish to Open VSX
        if: steps.config.outputs.do_ovsx == 'true'
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT not set — skipping Open VSX publish"
            exit 0
          fi
          PRE_FLAG=""
          if [ -n "${{ steps.config.outputs.pre_release_flag }}" ]; then
            PRE_FLAG="--pre-release"
          fi
          node scripts/publish-ovsx.mjs $PRE_FLAG
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Verify marketplace sync
        if: steps.config.outputs.do_ovsx == 'true'
        run: node scripts/verify-marketplace-sync.mjs --strict --retry=12

      # ── VS Code Marketplace ──────────────────────────────────────────────
      - name: Publish to VS Code Marketplace
        if: steps.config.outputs.do_vsce == 'true'
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — skipping VS Code Marketplace publish"
            exit 0
          fi
          echo "Publishing to VS Code Marketplace (Flags: ${{ steps.config.outputs.pre_release_flag }})..."
          set +e
          OUTPUT=$(vsce publish -p "$VSCE_PAT" ${{ steps.config.outputs.pre_release_flag }} 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "already exists|already been published"; then
              echo "::warning::Version already on VS Code Marketplace — treating as success"
              exit 0
            fi
            exit $CODE
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-bump.outputs.tag || github.ref_name }}
          name: Cursor Curse Monitor v${{ steps.config.outputs.version }}
          files: "*.vsix"
          generate_release_notes: true
          prerelease: ${{ steps.config.outputs.pre_release_flag != '' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.config.outputs.version }} ${{ steps.config.outputs.pre_release_flag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.config.outputs.do_ovsx }}" == "true" ]; then
             echo "**Open VSX:** Published" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.config.outputs.do_vsce }}" == "true" ]; then
             echo "**VS Code Marketplace:** Published" >> $GITHUB_STEP_SUMMARY
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 4. WEBSITE — Deploy GitHub Pages
  # ───────────────────────────────────────────────────────────────────────────
  website:
    name: Deploy Website
    # Run after deploy if deploy ran, OR if it's just a regular push to main
    needs: [deploy]
    if: always() && (needs.deploy.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dynamic site data
        run: node scripts/generate-site-data.mjs

      - name: Generate SEO artifacts
        run: |
          node scripts/generate-seo.mjs
          node scripts/validate-seo.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r website/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Unified Enterprise Pipeline for Cursor Curse Monitor
#
# Covers:
#   1. Continuous Integration (IDE Extension, Shared Package, Browser Extension, Admin SPA)
#   2. Asset, Security & Release Integrity Validation
#   3. SEO, Sitemap & Analytics Automation (with PR Fallback for Protected Branches)
#   4. Admin Mission Control Continuous Deployment (Cloudflare Pages)
#   5. Multi-Channel Extension Deployment (VS Code Marketplace, Open VSX, Firefox AMO, Chrome ZIP)
#   6. Marketing Website Deployment (GitHub Pages)
#   Release flow (Mission Control):
#     • push to main     → CI prepares next git tag (max live + patch) + deploys Mission Control
#     • publish-tag      → Admin picks tag → Deploy to Marketplaces (+ optional website)
#     • deploy-infra     → Admin and/or website only
#     • rollback         → Restore older tag as v{major}.{minor}.Rn
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    # Mondays 06:00 UTC — Refresh marketplace stats, visitor metrics, and sitemap lastmod
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      action_type:
        description: "Pipeline Action"
        required: true
        type: choice
        options:
          - "full-release - Bump version, tag & update Mission Control"
          - "publish-tag - Publish existing git tag to marketplaces"
          - "rollback - Restore previous tag as a new version"
          - "sync-open-vsx - Fast sync to Open VSX canonical namespace"
          - "deploy-infra - Deploy Mission Control admin & marketing site"
          - "seo-refresh - Refresh site data, sitemap & SEO manifest"
        default: "full-release - Bump version, tag & update Mission Control"
      version_type:
        description: "Release Type (for full-release)"
        required: false
        type: choice
        options:
          - "patch - Bug fix or minor update (e.g. v0.5.15)"
          - "minor - New Feature (e.g. v0.6.0)"
          - "major - Breaking / Production (e.g. v1.0.0)"
          - "custom - Specify exact version below"
        default: "patch - Bug fix or minor update (e.g. v0.5.15)"
      custom_version:
        description: "Custom Version (e.g. 0.6.0-beta.1) if custom selected"
        required: false
        type: string
      target_tag:
        description: "Target Tag (required for publish-tag or rollback, e.g. v0.5.14)"
        required: false
        type: string
      publish_market:
        description: "Publish Market"
        required: true
        type: choice
        options:
          - "Open VSX + Firefox AMO"
          - Both
          - VS Code Marketplace
          - Open VSX
          - Firefox AMO
        default: "Open VSX + Firefox AMO"
      release_channel:
        description: "Release Channel"
        required: true
        type: choice
        options:
          - Production
          - Beta (Pre-release)
        default: Production
      deploy_admin:
        description: "Deploy Mission Control admin panel (Cloudflare Pages)"
        required: false
        type: boolean
        default: false
      deploy_website:
        description: "Deploy marketing website (GitHub Pages)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. ROOT & CORE EXTENSION CI
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Validate (Root Extension)
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && startsWith(inputs.action_type, 'seo-refresh'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies (dependency security scan)
        run: npm ci --prefix website/admin

      - name: Install icon rendering tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Compile TypeScript
        run: npm run compile

      - name: Run test suite (Node 22 native tests + companions)
        run: npm test

      - name: Validate icon & logo assets
        run: npm run validate:assets

      - name: Validate marketing & mail assets
        run: test $(ls website/assets/marketing/*.png | wc -l) -ge 10 && test $(ls website/assets/mail/*.png | wc -l) -ge 3

      - name: Validate release metadata & sync integrity
        run: npm run validate:release

      - name: Guard canonical Open VSX namespace
        run: |
          set -euo pipefail
          if grep -rn 'open-vsx\.org/extension/LorapokLabs' README.md website/index.html website/privacy.html 2>/dev/null; then
            echo "::error::Duplicate Open VSX namespace (LorapokLabs) found in user-facing pages — use lorapok-labs only."
            exit 1
          fi
          echo "Canonical Open VSX links verified OK."

      - name: Security & credential scan
        run: npm run security:scan

      - name: Dependency security bot (npm advisories)
        run: npm run security:deps

      - name: Validate workspace version placeholders
        run: npm run version:check

      - name: Sync workspace versions for build
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run version:sync

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-curse-monitor-vsix-${{ github.sha }}
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BROWSER EXTENSION CI
  # ───────────────────────────────────────────────────────────────────────────
  browser-extension-ci:
    name: Browser Extension CI
    runs-on: ubuntu-latest
    needs: ci
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && startsWith(inputs.action_type, 'seo-refresh'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @lorapok/cursor-monitor-shared

      - name: Test browser extension
        run: npm run browser-ext:test

      - name: Build browser extension
        run: npm run browser-ext:build

      - name: Validate AMO metadata (dry-run)
        run: |
          node browser-extension/scripts/generate-amo-metadata.mjs
          node browser-extension/scripts/validate-amo-metadata.mjs

      - name: Build Chrome zip
        run: npm run build:chrome -w browser-extension

      - name: Build Firefox zip
        run: npm run build:firefox:zip -w browser-extension

      - name: Upload browser extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-${{ github.sha }}
          path: |
            browser-extension/dist/
            browser-extension/artifacts/chrome/*.zip
            browser-extension/artifacts/firefox/*.zip
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. ADMIN PANEL CI
  # ───────────────────────────────────────────────────────────────────────────
  admin-ci:
    name: Admin Panel CI
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && startsWith(inputs.action_type, 'seo-refresh'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/admin/package-lock.json

      - name: Install root dependencies (SEO scripts)
        run: npm ci

      - name: Generate site artifacts for admin build
        run: |
          node scripts/generate-site-data.mjs
          node scripts/generate-seo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: ${{ secrets.ANALYTICS_STATS_URL }}

      - name: Install admin dependencies
        working-directory: website/admin
        run: npm ci

      - name: Test admin panel
        working-directory: website/admin
        env:
          ADMIN_MASTER_EMAIL: ${{ secrets.ADMIN_MASTER_EMAIL }}
        run: npm test

      - name: Lint admin panel
        working-directory: website/admin
        run: npm run lint

      - name: Build admin panel
        working-directory: website/admin
        run: npm run build

      - name: Assert admin static artifacts in dist
        working-directory: website/admin
        run: test -f dist/site-data.json && test -f dist/seo.json

      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: website/admin/dist
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 3b. AUTO-PREPARE RELEASE TAG ON PUSH TO MAIN
  # ───────────────────────────────────────────────────────────────────────────
  prepare-tag-on-push:
    name: Prepare Release Tag (push to main)
    runs-on: ubuntu-latest
    needs: [ci, browser-extension-ci, admin-ci]
    permissions:
      contents: write
      pull-requests: write
    if: >-
      always()
      && needs.ci.result == 'success'
      && needs.browser-extension-ci.result == 'success'
      && needs.admin-ci.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, 'chore(seo):')
      && !contains(github.event.head_commit.message, 'chore: rollback')
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      prepared: ${{ steps.prepare.outputs.prepared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare git tag from live marketplace max
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-release-tag.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # 4a. ADMIN DEPLOY GATE (skip Cloudflare when push only touches unrelated paths)
  # ───────────────────────────────────────────────────────────────────────────
  admin-deploy-gate:
    name: Admin Deploy Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, 'chore(seo):')
    outputs:
      deploy_admin: ${{ steps.gate.outputs.deploy_admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Mission Control–affecting changes
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy_admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(website/admin/|packages/shared/|scripts/generate-(site-data|seo)\.mjs|website/assets/mail/)'
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qE "$PATTERN"; then
            echo "deploy_admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_admin=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare Pages deploy — push did not touch Mission Control paths."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 4. ADMIN PANEL DEPLOY (Cloudflare Pages)
  # ───────────────────────────────────────────────────────────────────────────
  admin-deploy:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: [admin-ci, release-prep, deploy, prepare-tag-on-push, admin-deploy-gate]
    if: >-
      always()
      && needs.admin-ci.result == 'success'
      && (
        (
          github.event_name == 'workflow_dispatch'
          && inputs.deploy_admin == true
          && (
            startsWith(inputs.action_type, 'deploy-infra')
            || (
              startsWith(inputs.action_type, 'full-release')
              && needs.release-prep.result == 'success'
            )
            || (
              (
                needs.release-prep.result == 'success' ||
                needs.release-prep.result == 'skipped'
              )
              && (
                needs.deploy.result == 'success' ||
                needs.deploy.result == 'skipped'
              )
            )
          )
        )
        || (
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && !contains(github.event.head_commit.message, 'chore(seo):')
          && (
            needs.prepare-tag-on-push.result == 'success' ||
            needs.prepare-tag-on-push.result == 'skipped'
          )
          && (
            needs.admin-deploy-gate.result == 'skipped' ||
            needs.admin-deploy-gate.outputs.deploy_admin == 'true'
          )
        )
      )
    environment:
      name: admin-production
      url: https://cursor-dev.lorapok.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download admin build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: website/admin/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/admin/package-lock.json

      - name: Install admin tooling (wrangler mail scripts only)
        working-directory: website/admin
        run: npm ci --ignore-scripts

      - name: Assert admin dist artifact
        working-directory: website/admin
        run: test -f dist/site-data.json && test -f dist/index.html

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the admin-production environment."
            exit 1
          fi

      - name: Setup outbound mail (enable-mail.mjs)
        id: mail_setup
        if: github.event_name == 'workflow_dispatch'
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/enable-mail.mjs

      - name: Verify outbound mail transport before Pages deploy
        id: mail_verify
        if: github.event_name == 'workflow_dispatch' && steps.mail_setup.outcome == 'success'
        continue-on-error: true
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAIL_RELAY_EXISTS_SETUP: ${{ steps.mail_setup.outputs.relay_exists }}
        run: node scripts/verify-mail-transport.mjs

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        id: pages_deploy
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAIL_SETUP: ${{ github.event_name == 'push' && 'true' || 'false' }}
          MAIL_RELAY_DEPLOYED: ${{ steps.mail_setup.outputs.relay_deployed || 'false' }}
          MAIL_RELAY_EXISTS_SETUP: ${{ github.event_name == 'push' && 'true' || steps.mail_setup.outputs.relay_exists || 'false' }}
          MAIL_RELAY_EXISTS_VERIFY: ${{ steps.mail_verify.outputs.relay_exists || 'false' }}
          MAIL_API_LIGHTWEIGHT: ${{ github.event_name == 'push' && 'true' || steps.mail_setup.outputs.mail_api_lightweight || 'false' }}
          CF_DEPLOY_PRE_COOLDOWN_SEC: "90"
          CF_DEPLOY_PRE_COOLDOWN_SEC_LIGHT: "0"
          CF_DEPLOY_MAX_ATTEMPTS: ${{ github.event_name == 'push' && '1' || '4' }}
        run: node scripts/deploy-pages-ci.mjs

      - name: Deploy stats cron worker (cred → CRON_SECRET)
        if: >-
          steps.pages_deploy.outcome == 'success'
          && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/deploy-stats-cron-ci.mjs

      - name: Warn when Pages deploy failed
        if: steps.pages_deploy.outcome != 'success'
        run: |
          echo "::warning::Cloudflare Pages deploy did not succeed — CI continues. Rerun workflow_dispatch deploy-infra after rate limits clear, or refresh CLOUDFLARE_API_TOKEN in admin-production."

  # ───────────────────────────────────────────────────────────────────────────
  # 5. SEO AUDIT, REFRESH & PROTECTED BRANCH PR CREATION
  # ───────────────────────────────────────────────────────────────────────────
  seo-pipeline:
    name: SEO & Metadata Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.action_type, 'seo-refresh')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(seo):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate SEO and live site data
        run: |
          npm run site:data
          npm run site:seo
          npm run site:seo:validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: https://cursor-dev.lorapok.tech/api/analytics/stats

      - name: Upload SEO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-manifest-artifacts
          path: |
            website/sitemap.xml
            website/robots.txt
            website/seo.json
            website/site-data.json
            website/visitor-stats.json
            website/readme-stats.svg
            website/stats/badge.json
            website/stats/badge-openvsx.json
            website/stats/badge-openvsx-total.json
            website/stats/badge-vscode.json
          retention-days: 14

      - name: Commit and publish refreshed SEO artifacts (with branch rule PR fallback)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/sitemap.xml website/robots.txt website/seo.json website/site-data.json website/visitor-stats.json website/readme-stats.svg website/stats/badge.json website/stats/badge-openvsx.json website/stats/badge-openvsx-total.json website/stats/badge-vscode.json
          # generate-seo.mjs also rewrites the <head> meta and JSON-LD blocks in
          # these pages; without them the committed structured data keeps
          # advertising whatever release was current when they were last touched.
          git add website/index.html website/privacy.html website/terms.html website/404.html
          if git diff --staged --quiet; then
            echo "No SEO artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh site-data, sitemap, and SEO manifest" \
            -m "Automated marketplace sync, visitor stats, and sitemap lastmod update."

          echo "Attempting to push refreshed SEO artifacts to main..."
          if git push origin main 2>/dev/null; then
            echo "Successfully pushed refreshed SEO artifacts directly to main."
          else
            echo "Direct push to main was declined by repository rules. Creating/updating Pull Request..."
            BRANCH="chore/seo-artifacts-refresh"
            git checkout -B "$BRANCH"
            git push origin "$BRANCH" --force
            gh pr create --base main --head "$BRANCH" \
              --title "chore(seo): refresh site-data, sitemap, and SEO manifest" \
              --body "Automated refresh of SEO metadata, marketplace stats, and sitemap generated by GitHub Actions." || \
            echo "Pull request for $BRANCH already exists or updated."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 6. RELEASE TRIGGER & ROLLBACK RESOLUTION
  # ───────────────────────────────────────────────────────────────────────────
  release-prep:
    name: Prepare & Tag Release
    runs-on: ubuntu-latest
    needs: [ci, browser-extension-ci, admin-ci]
    permissions:
      contents: write
    if: >-
      always()
      && needs.ci.result == 'success'
      && needs.browser-extension-ci.result == 'success'
      && needs.admin-ci.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && (
        startsWith(inputs.action_type, 'full-release') ||
        inputs.action_type == 'rollback - Restore previous tag as a new version'
      )
    outputs:
      new_version: ${{ steps.version_calc.outputs.new_version }}
      tag: ${{ steps.version_calc.outputs.tag }}
      should_deploy: ${{ steps.version_calc.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve live version plan (max across all channels)
        id: live_plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLAN=$(node scripts/compute-next-release-version.mjs --json --bump patch)
          echo "$PLAN" | node -e "
            const plan = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const out = process.env.GITHUB_OUTPUT;
            const fs = require('fs');
            const append = (k, v) => fs.appendFileSync(out, k + '=' + v + '\n');
            append('max_all_version', plan.maxAllVersion ?? '');
            append('recommended_version', plan.recommendedVersion ?? '');
            append('recommended_tag', plan.recommendedTag ?? '');
          "

      - name: Calculate Release Version
        id: version_calc
        env:
          ACTION: ${{ inputs.action_type }}
          TARGET_TAG: ${{ inputs.target_tag }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          LIVE_MAX_VERSION: ${{ steps.live_plan.outputs.max_all_version }}
          LIVE_RECOMMENDED_VERSION: ${{ steps.live_plan.outputs.recommended_version }}
          LIVE_RECOMMENDED_TAG: ${{ steps.live_plan.outputs.recommended_tag }}
        run: |
          if [[ "$ACTION" == "rollback"* ]]; then
            if [ -z "$TARGET_TAG" ]; then
              echo "::error::target_tag is required for rollback."
              exit 1
            fi
            if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TARGET_TAG' not found in repository."
              exit 1
            fi

            # Clean untracked files and restore files from tag
            git clean -fd
            git restore --source="$TARGET_TAG" --worktree --staged -- . ':!.github'
            git restore --source=HEAD --worktree --staged -- .github/

            # Rollback tag: v{major}.{minor}.R{n} from highest live version across all channels
            EXISTING_TAGS="$(git tag -l)"
            ROLLBACK_PLAN=$(EXISTING_TAGS="$EXISTING_TAGS" node scripts/compute-next-release-version.mjs --json --rollback)
            NEW_VERSION=$(echo "$ROLLBACK_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.recommendedVersion||'')")
            TAG=$(echo "$ROLLBACK_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.recommendedTag||'')")
            MAX_LIVE=$(echo "$ROLLBACK_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.maxAllVersion||'')")
            if [ -z "$NEW_VERSION" ] || [ -z "$TAG" ]; then
              echo "::error::Could not resolve rollback version from live marketplace data."
              exit 1
            fi
            echo "Rollback from $TARGET_TAG → $TAG (highest live was v${MAX_LIVE})"
            npm version --no-git-tag-version "$NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rollback to $TARGET_TAG (released as $TAG)"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping tag creation"
            else
              git tag "$TAG"
              git push origin "$TAG"
            fi
            git push origin main
          else
            BUMP_TYPE=$(echo "$VERSION_TYPE" | awk '{print $1}')
            CHANNEL="$RELEASE_CHANNEL"

            if [ "$BUMP_TYPE" = "custom" ]; then
              if [ -z "$CUSTOM_VERSION" ]; then
                echo "::error::custom_version is required when version_type is custom."
                exit 1
              fi
              NEW_VERSION="$CUSTOM_VERSION"
              CURRENT=$(node -p "require('./package.json').version.split('-')[0]")
              if [ "$NEW_VERSION" != "$CURRENT" ]; then
                npm version --no-git-tag-version "$NEW_VERSION"
              else
                echo "Version already $NEW_VERSION — re-tagging without package.json bump"
              fi
            elif [ "$CHANNEL" == "Beta (Pre-release)" ]; then
              # Beta uses marketplace --pre-release flags, not semver -beta in tags (VS Code/Open VSX policy).
              LIVE_PLAN=$(node scripts/compute-next-release-version.mjs --json --bump "$BUMP_TYPE")
              NEW_VERSION=$(echo "$LIVE_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.recommendedVersion||'')")
              MAX_LIVE=$(echo "$LIVE_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.maxAllVersion||'')")
              if [ -z "$NEW_VERSION" ]; then
                echo "::error::Could not resolve next beta version from live marketplace data."
                exit 1
              fi
              echo "Live max across all channels: v${MAX_LIVE} → beta pre-release target v${NEW_VERSION}"
              CURRENT=$(node -p "require('./package.json').version.split('-')[0]")
              if [ "$NEW_VERSION" != "$CURRENT" ]; then
                npm version --no-git-tag-version "$NEW_VERSION"
              else
                echo "package.json already at v$NEW_VERSION"
              fi
            else
              # Production: target = highest live version across all marketplaces + bump
              LIVE_PLAN=$(node scripts/compute-next-release-version.mjs --json --bump "$BUMP_TYPE")
              NEW_VERSION=$(echo "$LIVE_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.recommendedVersion||'')")
              MAX_LIVE=$(echo "$LIVE_PLAN" | node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(p.maxAllVersion||'')")
              if [ -z "$NEW_VERSION" ]; then
                echo "::error::Could not resolve next version from live marketplace data."
                exit 1
              fi
              echo "Live max across all channels: v${MAX_LIVE} → release target v${NEW_VERSION}"
              CURRENT=$(node -p "require('./package.json').version.split('-')[0]")
              if [ "$NEW_VERSION" != "$CURRENT" ]; then
                npm version --no-git-tag-version "$NEW_VERSION"
              else
                echo "package.json already at v$NEW_VERSION"
              fi
            fi

            TAG="v$NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            if ! git diff --quiet package.json package-lock.json 2>/dev/null; then
              git add package.json package-lock.json
              git commit -m "chore: release v$NEW_VERSION"
              git push origin main
            fi

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping tag creation"
            else
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # 7. DEPLOY TO MARKETPLACES (VS Code Marketplace, Open VSX, Firefox AMO)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [ci, browser-extension-ci, admin-ci, release-prep]
    if: >-
      always()
      && needs.ci.result == 'success'
      && needs.browser-extension-ci.result == 'success'
      && needs.admin-ci.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && !startsWith(inputs.action_type, 'deploy-infra')
      && (
        !startsWith(inputs.action_type, 'full-release')
        || inputs.release_channel == 'Beta (Pre-release)'
      )
      && (
        (needs.release-prep.result == 'success' && needs.release-prep.outputs.should_deploy == 'true') ||
        (
          needs.release-prep.result == 'skipped'
          && (
            inputs.action_type == 'publish-tag - Publish existing git tag to marketplaces' ||
            inputs.action_type == 'sync-open-vsx - Fast sync to Open VSX canonical namespace'
          )
        )
      )
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-prep.outputs.tag || inputs.target_tag || github.ref }}
          fetch-depth: 0

      - name: Sync publish scripts from main
        run: |
          git fetch origin main --depth=1
          for path in \
            browser-extension/scripts/verify-amo-status.mjs \
            browser-extension/scripts/lib-localized.mjs \
            browser-extension/scripts/publish-amo.mjs; do
            git show "origin/main:${path}" > "${path}"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install icon rendering tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Resolve release version
        id: release_version
        env:
          VERSION_INPUT: ${{ needs.release-prep.outputs.new_version }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ] && [ -n "$TARGET_TAG" ]; then
            VERSION="${TARGET_TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync workspace versions for marketplace build
        run: npm run version:sync -- --version "${{ steps.release_version.outputs.version }}"

      - name: Build and Package Extension
        run: |
          npm run compile
          npm run package

      - name: Build WebExtensions
        run: |
          npm run browser-ext:build
          npm run build:chrome -w browser-extension

      - name: Setup Market Tooling
        run: |
          npm install -g @vscode/vsce
          npm install -g ovsx

      - name: Resolve Configuration
        id: config
        env:
          ACTION: ${{ inputs.action_type }}
          VERSION_INPUT: ${{ needs.release-prep.outputs.new_version }}
          TARGET_TAG: ${{ inputs.target_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PUBLISH_MARKET: ${{ inputs.publish_market }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            elif [ -n "$TARGET_TAG" ]; then
              VERSION="${TARGET_TAG#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PRE_RELEASE=""
          if [[ "$RELEASE_CHANNEL" == "Beta (Pre-release)" || "$VERSION" == *"beta"* || "$VERSION" == *"rc"* || "$VERSION" == *"alpha"* ]]; then
            PRE_RELEASE="true"
          fi
          echo "pre_release=$PRE_RELEASE" >> "$GITHUB_OUTPUT"

          DO_OVSX="false"
          DO_VSCE="false"
          DO_AMO="false"
          TARGET="$PUBLISH_MARKET"

          if [[ "$ACTION" == "sync-open-vsx"* ]]; then
            DO_OVSX="true"
          elif [[ "$TARGET" == "Open VSX + Firefox AMO" ]]; then
            DO_OVSX="true"; DO_AMO="true"
          elif [[ -z "$TARGET" || "$TARGET" == "Both" ]]; then
            DO_OVSX="true"; DO_VSCE="true"; DO_AMO="true"
          elif [[ "$TARGET" == "Open VSX" ]]; then
            DO_OVSX="true"
          elif [[ "$TARGET" == "VS Code Marketplace" ]]; then
            DO_VSCE="true"
          elif [[ "$TARGET" == "Firefox AMO" ]]; then
            DO_AMO="true"
          fi

          if [ "$PRE_RELEASE" = "true" ]; then
            DO_AMO="false"
            echo "::notice::Skipping Firefox AMO — listed AMO has no pre-release channel in this pipeline."
          fi

          echo "do_ovsx=$DO_OVSX" >> "$GITHUB_OUTPUT"
          echo "do_vsce=$DO_VSCE" >> "$GITHUB_OUTPUT"
          echo "do_amo=$DO_AMO" >> "$GITHUB_OUTPUT"

      # ── VS Code Marketplace ────────────────────────────────────────────────
      - name: Publish to VS Code Marketplace
        if: steps.config.outputs.do_vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret missing."
            exit 1
          fi
          VSIX=$(ls -t *.vsix 2>/dev/null | head -n 1)
          FLAGS=()
          if [ "${{ steps.config.outputs.pre_release }}" = "true" ]; then
            FLAGS+=(--pre-release)
          fi
          set +e
          OUTPUT=$(vsce publish --packagePath "$VSIX" -p "$VSCE_PAT" "${FLAGS[@]}" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && ! echo "$OUTPUT" | grep -qiE 'already exists|already published'; then
            exit "$STATUS"
          fi
          if echo "$OUTPUT" | grep -qiE 'already exists|already published'; then
            echo "::warning::VS Code Marketplace already has this version — OK"
          fi

      # ── Open VSX ──────────────────────────────────────────────────────────
      - name: Publish to Open VSX (canonical lorapok-labs)
        if: steps.config.outputs.do_ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret missing."
            exit 1
          fi
          FLAGS=()
          if [ "${{ steps.config.outputs.pre_release }}" = "true" ]; then
            FLAGS+=(--pre-release)
          fi
          node scripts/publish-ovsx.mjs "${FLAGS[@]}"

      - name: Publish to Open VSX (LorapokLabs duplicate — keep for existing installs)
        if: steps.config.outputs.do_ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret missing."
            exit 1
          fi
          VSIX=$(ls -t *.vsix 2>/dev/null | head -n 1)
          if [ -z "$VSIX" ]; then
            echo "::error::No LorapokLabs VSIX found for duplicate Open VSX publish."
            exit 1
          fi
          FLAGS=()
          if [ "${{ steps.config.outputs.pre_release }}" = "true" ]; then
            FLAGS+=(--pre-release)
          fi
          set +e
          OUTPUT=$(ovsx publish "$VSIX" -p "$OVSX_PAT" "${FLAGS[@]}" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && ! echo "$OUTPUT" | grep -qi 'already published'; then
            exit "$STATUS"
          fi
          if echo "$OUTPUT" | grep -qi 'already published'; then
            echo "::warning::LorapokLabs duplicate listing already has this version — OK"
          fi

      # ── Firefox AMO ────────────────────────────────────────────────────────
      - name: Publish to Firefox Add-ons (AMO)
        if: steps.config.outputs.do_amo == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required for Firefox AMO publish"
            exit 1
          fi
          set +e
          OUTPUT=$(node browser-extension/scripts/publish-amo.mjs 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE 'already exists|already published|Submission failed \(2\): Conflict'; then
              echo "::warning::AMO version ${RELEASE_VERSION} is already published — treating as success (idempotent redeploy)"
            else
              exit "$STATUS"
            fi
          fi

      - name: Stage Chrome zip for website
        if: steps.config.outputs.do_amo == 'true'
        run: |
          mkdir -p website/downloads
          cp browser-extension/artifacts/chrome/*.zip "website/downloads/cursor-curse-monitor-chrome-${{ steps.config.outputs.version }}.zip" 2>/dev/null || true

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: >-
          steps.config.outputs.do_vsce == 'true' ||
          steps.config.outputs.do_ovsx == 'true' ||
          steps.config.outputs.do_amo == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-prep.outputs.tag || inputs.target_tag || github.ref_name }}
          name: Cursor Curse Monitor v${{ steps.config.outputs.version }}
          files: |
            *.vsix
            browser-extension/artifacts/firefox/*.xpi
            browser-extension/artifacts/chrome/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.config.outputs.pre_release == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 8. MARKETING WEBSITE DEPLOY (GitHub Pages)
  # ───────────────────────────────────────────────────────────────────────────
  website:
    name: Deploy Marketing Website
    needs: [ci, browser-extension-ci, admin-ci, release-prep, deploy]
    if: >-
      always()
      && needs.ci.result == 'success'
      && needs.browser-extension-ci.result == 'success'
      && needs.admin-ci.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.deploy_website == true
      && !startsWith(inputs.action_type, 'full-release')
      && (
        startsWith(inputs.action_type, 'deploy-infra')
        || needs.deploy.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate dynamic site data
        run: node scripts/generate-site-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: ${{ secrets.ANALYTICS_STATS_URL }}

      - name: Generate SEO artifacts
        run: |
          node scripts/generate-seo.mjs
          node scripts/validate-seo.mjs

      - name: Build and stage Chrome Extension ZIP
        run: |
          npm run build:chrome -w browser-extension
          mkdir -p website/downloads
          cp browser-extension/artifacts/chrome/*.zip website/downloads/ 2>/dev/null || true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r website/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────────────────────────────────
  # 9. CI TEST SUMMARY (PR + main push — visible in Actions summary tab)
  # ───────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [ci, browser-extension-ci, admin-ci]
    if: >-
      always()
      && (
        github.event_name == 'pull_request'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    steps:
      - name: Publish test summary
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BROWSER_RESULT: ${{ needs.browser-extension-ci.result }}
          ADMIN_RESULT: ${{ needs.admin-ci.result }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⚪" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }
          {
            echo "## Cursor Curse Monitor — CI test results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Root extension (compile, npm test, VSIX) | $(status_icon "$CI_RESULT") **$CI_RESULT** |"
            echo "| Browser extension | $(status_icon "$BROWSER_RESULT") **$BROWSER_RESULT** |"
            echo "| Admin SPA (Vitest) | $(status_icon "$ADMIN_RESULT") **$ADMIN_RESULT** |"
            echo ""
            echo "_Dependency advisories: **Dependency Security Bot** workflow + \`npm run security:deps\` in CI._"
            echo ""
            if [ "$CI_RESULT" = "success" ] && [ "$BROWSER_RESULT" = "success" ] && [ "$ADMIN_RESULT" = "success" ]; then
              echo "All checks passed."
            else
              echo "**Some checks failed** — open the failed job logs above for details."
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Unified Enterprise Pipeline for Cursor Curse Monitor
#
# Covers:
#   1. Continuous Integration (IDE Extension, Shared Package, Browser Extension, Admin SPA)
#   2. Asset, Security & Release Integrity Validation
#   3. SEO, Sitemap & Analytics Automation (with PR Fallback for Protected Branches)
#   4. Admin Mission Control Continuous Deployment (Cloudflare Pages)
#   5. Multi-Channel Extension Deployment (VS Code Marketplace, Open VSX, Firefox AMO, Chrome ZIP)
#   6. Marketing Website Deployment (GitHub Pages)
#   7. Automated Version Bumping, Rollback & Tag Publishing
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    # Mondays 06:00 UTC — Refresh marketplace stats, visitor metrics, and sitemap lastmod
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      action_type:
        description: "Pipeline Action"
        required: true
        type: choice
        options:
          - "full-release - Bump version & publish all channels"
          - "publish-tag - Publish existing git tag to marketplaces"
          - "rollback - Restore previous tag as a new version"
          - "sync-open-vsx - Fast sync to Open VSX canonical namespace"
          - "seo-refresh - Refresh site data, sitemap & SEO manifest"
        default: "full-release - Bump version & publish all channels"
      version_type:
        description: "Release Type (for full-release)"
        required: false
        type: choice
        options:
          - "patch - Bug fix or minor update (e.g. v0.5.15)"
          - "minor - New Feature (e.g. v0.6.0)"
          - "major - Breaking / Production (e.g. v1.0.0)"
          - "custom - Specify exact version below"
        default: "patch - Bug fix or minor update (e.g. v0.5.15)"
      custom_version:
        description: "Custom Version (e.g. 0.6.0-beta.1) if custom selected"
        required: false
        type: string
      target_tag:
        description: "Target Tag (required for publish-tag or rollback, e.g. v0.5.14)"
        required: false
        type: string
      publish_market:
        description: "Publish Market"
        required: true
        type: choice
        options:
          - Both
          - VS Code Marketplace
          - Open VSX
        default: Both
      release_channel:
        description: "Release Channel"
        required: true
        type: choice
        options:
          - Production
          - Beta (Pre-release)
        default: Production

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. ROOT & CORE EXTENSION CI
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Validate (Root Extension)
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && inputs.action_type == 'seo-refresh')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run test suite (Node 22 native tests + companions)
        run: npm test

      - name: Validate icon & logo assets
        run: npm run validate:assets

      - name: Validate release metadata & sync integrity
        run: npm run validate:release

      - name: Guard canonical Open VSX namespace
        run: |
          set -euo pipefail
          if grep -rn 'open-vsx\.org/extension/LorapokLabs' README.md website/index.html website/site-data.json 2>/dev/null; then
            echo "::error::Duplicate Open VSX namespace (LorapokLabs) found — use lorapok-labs only."
            exit 1
          fi
          echo "Canonical Open VSX links verified OK."

      - name: Security & credential scan
        run: npm run security:scan

      - name: Dynamically inject commit hash (Push to main only)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          NEW_VERSION="${CURRENT}-beta.${SHORT_SHA}"
          npm version --no-git-tag-version "$NEW_VERSION"
          echo "Dynamic version: $NEW_VERSION"

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-curse-monitor-vsix-${{ github.sha }}
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BROWSER EXTENSION CI
  # ───────────────────────────────────────────────────────────────────────────
  browser-extension-ci:
    name: Browser Extension CI
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && inputs.action_type == 'seo-refresh')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @lorapok/cursor-monitor-shared

      - name: Test browser extension
        run: npm run browser-ext:test

      - name: Build browser extension
        run: npm run browser-ext:build

      - name: Validate AMO metadata (dry-run)
        run: |
          node browser-extension/scripts/generate-amo-metadata.mjs
          node browser-extension/scripts/validate-amo-metadata.mjs

      - name: Build Chrome zip
        run: npm run build:chrome -w browser-extension

      - name: Upload browser extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-${{ github.sha }}
          path: |
            browser-extension/dist/
            browser-extension/artifacts/chrome/*.zip
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. ADMIN PANEL CI
  # ───────────────────────────────────────────────────────────────────────────
  admin-ci:
    name: Admin Panel CI
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      !(github.event_name == 'push'
        && !startsWith(github.ref, 'refs/tags/')
        && contains(github.event.head_commit.message, 'chore: release'))
      && !(github.event_name == 'workflow_dispatch' && inputs.action_type == 'seo-refresh')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/admin/package-lock.json

      - name: Install root dependencies (SEO scripts)
        run: npm ci

      - name: Generate site artifacts for admin build
        run: |
          node scripts/generate-site-data.mjs
          node scripts/generate-seo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: ${{ secrets.ANALYTICS_STATS_URL }}

      - name: Install admin dependencies
        working-directory: website/admin
        run: npm ci

      - name: Test admin panel
        working-directory: website/admin
        env:
          ADMIN_MASTER_EMAIL: ${{ secrets.ADMIN_MASTER_EMAIL }}
        run: npm test

      - name: Lint admin panel
        working-directory: website/admin
        run: npm run lint

      - name: Build admin panel
        working-directory: website/admin
        run: npm run build

      - name: Assert admin static artifacts in dist
        working-directory: website/admin
        run: test -f dist/site-data.json && test -f dist/seo.json

  # ───────────────────────────────────────────────────────────────────────────
  # 4. ADMIN PANEL DEPLOY (Cloudflare Pages)
  # ───────────────────────────────────────────────────────────────────────────
  admin-deploy:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    needs: admin-ci
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, 'chore(seo):')
    environment:
      name: admin-production
      url: https://cursor-dev.lorapok.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate site artifacts
        run: |
          node scripts/generate-site-data.mjs
          node scripts/generate-seo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: ${{ secrets.ANALYTICS_STATS_URL }}

      - name: Install admin dependencies
        working-directory: website/admin
        run: npm ci

      - name: Build admin panel
        working-directory: website/admin
        run: npm run build

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the admin-production environment."
            exit 1
          fi

      - name: Sync Pages runtime secret for outbound email
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MAIL_TOKEN="${CLOUDFLARE_EMAIL_API_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          if [ -z "$MAIL_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_EMAIL_API_TOKEN or CLOUDFLARE_API_TOKEN with Email Sending permission."
            exit 1
          fi
          printf '%s' "$MAIL_TOKEN" | npx wrangler pages secret put CLOUDFLARE_EMAIL_API_TOKEN --project-name=cursor-monitor-admin
          npx wrangler email sending enable lorapok.tech || echo "::warning::Onboard lorapok.tech in Dashboard → Email Service if sends return 401."

      - name: Deploy to Cloudflare Pages
        working-directory: website/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=cursor-monitor-admin --branch=main

  # ───────────────────────────────────────────────────────────────────────────
  # 5. SEO AUDIT, REFRESH & PROTECTED BRANCH PR CREATION
  # ───────────────────────────────────────────────────────────────────────────
  seo-pipeline:
    name: SEO & Metadata Pipeline
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action_type == 'seo-refresh') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(seo):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate SEO and live site data
        run: |
          npm run site:data
          npm run site:seo
          npm run site:seo:validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: https://cursor-dev.lorapok.tech/api/analytics/stats

      - name: Upload SEO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-manifest-artifacts
          path: |
            website/sitemap.xml
            website/robots.txt
            website/seo.json
            website/site-data.json
            website/visitor-stats.json
          retention-days: 14

      - name: Commit and publish refreshed SEO artifacts (with branch rule PR fallback)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/sitemap.xml website/robots.txt website/seo.json website/site-data.json website/visitor-stats.json
          if git diff --staged --quiet; then
            echo "No SEO artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(seo): refresh site-data, sitemap, and SEO manifest" \
            -m "Automated marketplace sync, visitor stats, and sitemap lastmod update."

          echo "Attempting to push refreshed SEO artifacts to main..."
          if git push origin main 2>/dev/null; then
            echo "Successfully pushed refreshed SEO artifacts directly to main."
          else
            echo "Direct push to main was declined by repository rules. Creating/updating Pull Request..."
            BRANCH="chore/seo-artifacts-refresh"
            git checkout -B "$BRANCH"
            git push origin "$BRANCH" --force
            gh pr create --base main --head "$BRANCH" \
              --title "chore(seo): refresh site-data, sitemap, and SEO manifest" \
              --body "Automated refresh of SEO metadata, marketplace stats, and sitemap generated by GitHub Actions." || \
            echo "Pull request for $BRANCH already exists or updated."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 6. RELEASE TRIGGER & ROLLBACK RESOLUTION
  # ───────────────────────────────────────────────────────────────────────────
  release-prep:
    name: Prepare & Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch'
      && (
        inputs.action_type == 'full-release - Bump version & publish all channels' ||
        inputs.action_type == 'rollback - Restore previous tag as a new version'
      )
    outputs:
      new_version: ${{ steps.version_calc.outputs.new_version }}
      tag: ${{ steps.version_calc.outputs.tag }}
      should_deploy: ${{ steps.version_calc.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate Release Version
        id: version_calc
        env:
          ACTION: ${{ inputs.action_type }}
          TARGET_TAG: ${{ inputs.target_tag }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          if [[ "$ACTION" == "rollback"* ]]; then
            if [ -z "$TARGET_TAG" ]; then
              echo "::error::target_tag is required for rollback."
              exit 1
            fi
            if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TARGET_TAG' not found in repository."
              exit 1
            fi

            # Restore files from tag
            git restore --source="$TARGET_TAG" --worktree --staged -- . ':!.github'
            git restore --source=HEAD --worktree --staged -- .github/

            # Bump patch higher than current main
            CURRENT_MAIN_VER=$(node -p "require('./package.json').version.split('-')[0]")
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.version='$CURRENT_MAIN_VER'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            TAG="v$NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rollback to $TARGET_TAG (released as v$NEW_VERSION)"
            git tag "$TAG"
            git push origin main
            git push origin "$TAG"
          else
            BUMP_TYPE=$(echo "$VERSION_TYPE" | awk '{print $1}')
            CHANNEL="$RELEASE_CHANNEL"

            if [ "$BUMP_TYPE" = "custom" ]; then
              if [ -z "$CUSTOM_VERSION" ]; then
                echo "::error::custom_version is required when version_type is custom."
                exit 1
              fi
              NEW_VERSION="${{ inputs.custom_version }}"
              npm version --no-git-tag-version "$NEW_VERSION"
            elif [ "$CHANNEL" == "Beta (Pre-release)" ]; then
              node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.version=pkg.version.split('-')[0]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
              CURRENT=$(node -p "require('./package.json').version")
              npm version $BUMP_TYPE --no-git-tag-version --preid=beta
              NEW_VERSION=$(node -p "require('./package.json').version")
            else
              node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.version=pkg.version.split('-')[0]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
              npm version $BUMP_TYPE --no-git-tag-version
              NEW_VERSION=$(node -p "require('./package.json').version")
            fi

            TAG="v$NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: release v$NEW_VERSION"
            git tag "$TAG"
            git push origin main
            git push origin "$TAG"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # 7. DEPLOY TO MARKETPLACES (VS Code Marketplace, Open VSX, Firefox AMO)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [release-prep]
    if: >-
      always() && (
        needs.release-prep.outputs.should_deploy == 'true' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.action_type == 'publish-tag - Publish existing git tag to marketplaces' || inputs.action_type == 'sync-open-vsx - Fast sync to Open VSX canonical namespace'))
      )
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-prep.outputs.tag || inputs.target_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Extension
        run: |
          npm run compile
          npm run package

      - name: Build WebExtensions
        run: |
          npm run browser-ext:build
          npm run build:chrome -w browser-extension

      - name: Setup Market Tooling
        run: |
          npm install -g @vscode/vsce
          npm install -g ovsx

      - name: Resolve Configuration
        id: config
        env:
          ACTION: ${{ inputs.action_type }}
          VERSION_INPUT: ${{ needs.release-prep.outputs.new_version }}
          TARGET_TAG: ${{ inputs.target_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PUBLISH_MARKET: ${{ inputs.publish_market }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            elif [ -n "$TARGET_TAG" ]; then
              VERSION="${TARGET_TAG#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PRE_RELEASE=""
          if [[ "$RELEASE_CHANNEL" == "Beta (Pre-release)" || "$VERSION" == *"beta"* || "$VERSION" == *"rc"* || "$VERSION" == *"alpha"* ]]; then
            PRE_RELEASE="true"
          fi
          echo "pre_release=$PRE_RELEASE" >> "$GITHUB_OUTPUT"

          DO_OVSX="false"
          DO_VSCE="false"
          DO_AMO="false"
          TARGET="$PUBLISH_MARKET"

          if [[ "$ACTION" == "sync-open-vsx"* ]]; then
            DO_OVSX="true"
          elif [[ -z "$TARGET" || "$TARGET" == "Both" ]]; then
            DO_OVSX="true"; DO_VSCE="true"; DO_AMO="true"
          elif [[ "$TARGET" == "Open VSX" ]]; then
            DO_OVSX="true"
          elif [[ "$TARGET" == "VS Code Marketplace" ]]; then
            DO_VSCE="true"
          elif [[ "$TARGET" == "Firefox AMO" ]]; then
            DO_AMO="true"
          fi

          echo "do_ovsx=$DO_OVSX" >> "$GITHUB_OUTPUT"
          echo "do_vsce=$DO_VSCE" >> "$GITHUB_OUTPUT"
          echo "do_amo=$DO_AMO" >> "$GITHUB_OUTPUT"

      # ── VS Code Marketplace ────────────────────────────────────────────────
      - name: Publish to VS Code Marketplace
        if: steps.config.outputs.do_vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret missing."
            exit 1
          fi
          VSIX=$(ls -t *.vsix 2>/dev/null | head -n 1)
          FLAGS=()
          if [ "${{ steps.config.outputs.pre_release }}" = "true" ]; then
            FLAGS+=(--pre-release)
          fi
          vsce publish --packagePath "$VSIX" -p "$VSCE_PAT" "${FLAGS[@]}"

      # ── Open VSX ──────────────────────────────────────────────────────────
      - name: Publish to Open VSX (canonical lorapok-labs)
        if: steps.config.outputs.do_ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret missing."
            exit 1
          fi
          VSIX=$(ls -t *.vsix 2>/dev/null | head -n 1)
          ovsx publish "$VSIX" -p "$OVSX_PAT"

      # ── Firefox AMO ────────────────────────────────────────────────────────
      - name: Publish to Firefox Add-ons (AMO)
        if: steps.config.outputs.do_amo == 'true'
        run: |
          mkdir -p browser-extension/artifacts/firefox
          npx web-ext@8 sign \
            --source-dir browser-extension/dist \
            --artifacts-dir browser-extension/artifacts/firefox \
            --channel listed \
            --amo-metadata browser-extension/amo/amo-metadata.generated.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" || echo "::warning::AMO signing skipped or pending review."
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Stage Chrome zip for website
        if: steps.config.outputs.do_amo == 'true'
        run: |
          mkdir -p website/downloads
          cp browser-extension/artifacts/chrome/*.zip "website/downloads/cursor-curse-monitor-chrome-${{ steps.config.outputs.version }}.zip" 2>/dev/null || true

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.config.outputs.do_vsce == 'true' || steps.config.outputs.do_ovsx == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-prep.outputs.tag || inputs.target_tag || github.ref_name }}
          name: Cursor Curse Monitor v${{ steps.config.outputs.version }}
          files: |
            *.vsix
            browser-extension/artifacts/firefox/*.xpi
            browser-extension/artifacts/chrome/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.config.outputs.pre_release == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 8. MARKETING WEBSITE DEPLOY (GitHub Pages)
  # ───────────────────────────────────────────────────────────────────────────
  website:
    name: Deploy Marketing Website
    needs: [deploy]
    if: always() && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate dynamic site data
        run: node scripts/generate-site-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_PROJECT_ID: cursor-curse-by-lorapok
          ANALYTICS_STATS_URL: ${{ secrets.ANALYTICS_STATS_URL }}

      - name: Generate SEO artifacts
        run: |
          node scripts/generate-seo.mjs
          node scripts/validate-seo.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r website/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

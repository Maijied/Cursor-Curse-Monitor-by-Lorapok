name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (manual deploy only)"
        required: false
        default: ""
      publish_ovsx:
        description: "Publish to Open VSX"
        type: boolean
        default: true
      publish_vscode:
        description: "Publish to VS Code Marketplace"
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release with VSIX"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VSCE_PUBLISHER: "LorapokLabs"
      OVSX_PUBLISHER: "lorapok-labs"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Install publishing tools
        run: |
          npm install -g @vscode/vsce
          npm install -g ovsx

      - name: Show VSIX size
        run: ls -lh *.vsix

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Open VSX namespace (Lorapok Labs)
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set — skip namespace creation"
            exit 0
          fi
          ovsx create-namespace $OVSX_PUBLISHER -p "$OVSX_PAT" || \
            echo "Namespace $OVSX_PUBLISHER already exists — continuing"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish_ovsx)
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set. Add it in repo Settings → Secrets."
            exit 1
          fi
          set +e
          OUTPUT=$(ovsx publish -p "$OVSX_PAT" --publisher $OVSX_PUBLISHER 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUTPUT" | grep -q "already published"; then
            echo "::warning::Version already on Open VSX — treating as success"
            exit 0
          fi
          exit $CODE
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to VS Code Marketplace
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish_vscode)
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — skip VS Code Marketplace publish"
            exit 0
          fi
          set +e
          OUTPUT=$(vsce publish -p "$VSCE_PAT" 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUTPUT" | grep -qiE "already exists|already been published"; then
            echo "::warning::Version already on VS Code Marketplace — treating as success"
            exit 0
          fi
          exit $CODE
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Cursor Curse Monitor v${{ steps.version.outputs.value }}
          files: "*.vsix"
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix-v${{ steps.version.outputs.value }}
          path: "*.vsix"
          retention-days: 90
          if-no-files-found: error

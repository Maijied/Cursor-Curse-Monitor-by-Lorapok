name: Procedure on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: procedure-on-merge-main
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate procedure retrospective
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/procedure-finalize-pr.mjs --pr "${GITHUB_PR_NUMBER}"

      - name: Upload retrospective artifact
        uses: actions/upload-artifact@v4
        with:
          name: procedure-pr-${{ github.event.pull_request.number }}
          path: procedure/pr-${{ github.event.pull_request.number }}_*_merged.md
          if-no-files-found: error

      - name: Commit retrospective (push or open PR)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add procedure/pr-${PR_NUMBER}_*_merged.md
          if git diff --cached --quiet; then
            echo "No procedure file to commit"
            exit 0
          fi
          git commit -m "docs(procedure): retrospective for PR #${PR_NUMBER}"
          echo "Attempting to push procedure retrospective to main..."
          if git push origin main 2>/dev/null; then
            echo "Successfully pushed procedure retrospective to main."
          else
            echo "Direct push declined by repository rules. Opening PR..."
            BRANCH="docs/procedure-pr-${PR_NUMBER}"
            git checkout -B "$BRANCH"
            git push origin "$BRANCH" --force
            gh pr create --base main --head "$BRANCH" \
              --title "docs(procedure): retrospective for PR #${PR_NUMBER}" \
              --body "Auto-generated by [procedure-on-merge](.github/workflows/procedure-on-merge.yml). Source merge: #${PR_NUMBER}." \
              || echo "Pull request for ${BRANCH} already exists or was updated."
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Warning Notification">
  <defs>
    <linearGradient id="warningGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5b942"/>
      <stop offset="50%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="warningBody" x1="32" y1="40" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="warningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b942"/>
      <stop offset="70%" stop-color="#f5b942" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <filter id="warningFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background glow circle -->
  <circle cx="64" cy="64" r="56" fill="url(#warningGrad)" opacity="0.1" filter="url(#warningFilter)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot body -->
  <ellipse cx="64" cy="78" rx="28" ry="22" fill="url(#warningBody)" stroke="#f5b942" stroke-width="2"/>
  <ellipse cx="64" cy="52" rx="24" ry="20" fill="url(#warningBody)" stroke="#f5b942" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="64" cy="44" rx="22" ry="18" fill="url(#warningBody)" stroke="#f5b942" stroke-width="2"/>
  
  <!-- Concerned eyes -->
  <ellipse cx="54" cy="42" rx="6" ry="4" fill="#0d1117" stroke="#f5b942" stroke-width="1.5"/>
  <ellipse cx="74" cy="42" rx="6" ry="4" fill="#0d1117" stroke="#f5b942" stroke-width="1.5"/>
  
  <!-- Glowing pupils -->
  <circle cx="54" cy="42" r="2.5" fill="#f5b942" filter="url(#warningFilter)">
    <animate attributeName="r" values="2.5;3;2.5" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="42" r="2.5" fill="#f5b942" filter="url(#warningFilter)">
    <animate attributeName="r" values="2.5;3;2.5" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  
  <!-- Neutral mouth -->
  <path d="M56 52 Q64 52 72 52" fill="none" stroke="#f5b942" stroke-width="2" stroke-linecap="round" filter="url(#warningFilter)">
    <animate attributeName="d" values="M56 52 Q64 52 72 52;M56 52 Q64 54 72 52;M56 52 Q64 52 72 52" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Warning triangle -->
  <path d="M64 40 L84 80 L44 80 Z" fill="none" stroke="url(#warningGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#warningFilter)">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="1s" fill="freeze"/>
  </path>
  
  <!-- Exclamation mark -->
  <circle cx="64" cy="72" r="3" fill="#f5b942" filter="url(#warningFilter)">
    <animate attributeName="r" values="3;4;3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <path d="M64 50 L64 64" fill="none" stroke="#f5b942" stroke-width="3" stroke-linecap="round" filter="url(#warningFilter)">
    <animate attributeName="stroke-width" values="3;4;3" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Alert pulse rings -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#f5b942" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="45;55;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
